<!DOCTYPE html>
<html>
<head>
<title>Leaderboard</title>

<style>
body{
background:black;
color:white;
font-family:Arial;
text-align:center;
}

h1{
color:#00ffff;
margin-top:50px;
}

#list{
margin-top:30px;
font-size:22px;
}

button{
margin-top:40px;
padding:15px 30px;
font-size:20px;
border:none;
border-radius:10px;
background:#00ffff;
cursor:pointer;
}
</style>
</head>

<body>

<h1>🏆 TOP 10 PLAYERS</h1>

<div id="list"></div>

<button onclick="goBack()">⬅ Back</button>

<script>

function loadLeaderboard(){

fetch("/get_scores")
.then(res => res.json())
.then(data => {

    let list = "";

data.forEach((p, i) => {

   let modeText = p.mode;

if(modeText === "classic"){
    modeText = "Classic Mode";
}
else if(modeText === "timeAttack"){
    modeText = "Time Attack";
}
else if(modeText === "survival"){
    modeText = "Survival Mode";
}
else if(modeText === "zen"){
    modeText = "Zen Mode";
}

let text = p.player + " - " + p.score + " - " + modeText; 

    if(i === 0){
        list += "🥇 " + text + "<br>";
    }
    else if(i === 1){
        list += "🥈 " + text + "<br>";
    }
    else if(i === 2){
        list += "🥉 " + text + "<br>";
    }
    else{
        list += (i + 1) + ". " + text + "<br>";
    }

});

    document.getElementById("list").innerHTML = list;
});
}

function goBack(){
window.location.href = "/game";
}

loadLeaderboard();

</script>

</body>
</html>
